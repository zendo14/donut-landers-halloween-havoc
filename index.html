<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#120b22">
<title>The Donut Landers: Halloween Havoc</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <canvas id="game" width="540" height="960" aria-label="The Donut Landers Halloween Havoc game"></canvas>

  <section id="menu" class="overlay">
    <div class="panel title-panel">
      <div class="eyebrow">THE DONUT LANDERS</div>
      <h1>Halloween Havoc</h1>
      <p>Pick your Donut Lander.</p>
      <div id="characterChoices" class="characters"></div>
      <button id="startBtn" class="primary" disabled>Start Game</button>
      <button id="leaderboardBtn" class="secondary">Top 10</button>
      <p class="hint">Tap to jump • Avoid obstacles • Collect candy</p>
    </div>
  </section>

  <section id="gameOver" class="overlay hidden">
    <div class="panel">
      <div class="eyebrow">GAME OVER</div>
      <h2 id="finalTitle">Nice run!</h2>
      <div class="final-score"><span id="finalScore">0</span></div>
      <p id="finalLevel"></p>
      <div id="nameEntry" class="name-entry hidden">
        <p>You made the Top 10!</p>
        <input id="playerName" maxlength="12" placeholder="YOUR NAME" autocomplete="off">
        <button id="saveScoreBtn" class="primary">Save Score</button>
      </div>
      <div id="notQualified" class="hidden"><p>Keep running to reach the Top 10.</p></div>
      <button id="playAgainBtn" class="primary">Play Again</button>
      <button id="menuBtn" class="secondary">Character Select</button>
      <button id="gameOverLeaderboardBtn" class="secondary">Top 10</button>
    </div>
  </section>

  <section id="leaderboard" class="overlay hidden">
    <div class="panel leaderboard-panel">
      <div class="eyebrow">THE DONUT LANDERS</div>
      <h2>Top 10</h2>
      <ol id="scores"></ol>
      <button id="closeLeaderboardBtn" class="primary">Back</button>
    </div>
  </section>

  <div id="hud" class="hud hidden">
    <div><span class="label">SCORE</span><span id="score">0</span></div>
    <div><span class="label">LEVEL</span><span id="level">1</span></div>
    <div><span class="label">x</span><span id="multiplier">1</span></div>
  </div>

</div>
<script src="game.js"></script>
</body>
</html>
